[project]
name = "blend"
version = "1.0.0"
description = "Blend with semantic seekers (master's thesis fork of Blend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "numpy",
    "duckdb>=1.1.3",
    "tqdm",
    "pyarrow",
    "psycopg[binary]",
    "vertica-python",
    "xgboost>=2.0",
    "faiss-cpu>=1.8.0",
    "liftus",
    "snoopy",
    "sentence-transformers",
    "nltk",
    "scipy",
]

[tool.uv]
python-preference = "managed"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
liftus = { git = "https://github.com/FR-SON/judit", subdirectory = "baselines/liftus", tag = "v1.0.0" }
snoopy = { git = "https://github.com/FR-SON/judit", subdirectory = "baselines/snoopy", tag = "v1.0.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Accessing the 'model_fields' attribute on the instance is deprecated:DeprecationWarning",
    "ignore:.*pydantic.*:DeprecationWarning",
]
log_cli = false
