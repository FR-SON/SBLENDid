[Dataset]
name = santos
; root = datasets    ; optional; relative to repo root

[Semantic]
sidecar_filename     = blend_index_basenames.parquet
faiss_quant          = flat
faiss_hnsw_M         = 64
faiss_hnsw_ef_construction = 200
; Pins: present = fixed depth for every k; absent = derived from the plan's k (src/Semantic/depths.py).
faiss_hnsw_ef_search = 64
faiss_k_coarse       = 500
; Used only when the pins are absent.
; vote_depth_factor    = 2.0
; restricted_k_coarse  = 500
device               = cpu
; off (default): a query column missing from the index is a hard error; auto: encode it from its cells at query time (opt-in).
query_encode         = off

[Semantic.SU]
approach   = liftus
index_name = default

[Semantic.SJ]
approach   = snoopy
index_name = default
