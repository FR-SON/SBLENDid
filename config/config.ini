[Dataset]
name = santos
; root = datasets    ; optional; relative to repo root

[Database]
; duckdb + faiss: dbms = duckdb, vector_backend = faiss; postgres + pgvector: dbms = postgres, vector_backend = pgvector
dbms        = duckdb
db_filename = blend.duckdb
index_table = blend_index
; Optional query-time caps; DuckDB otherwise sizes off the host, not the container.
; duckdb_threads =
; duckdb_memory_limit =
; Postgres connection (dbms = postgres); inside docker use the pg container name, not the published port.
host     = blend-pg
port     = 5432
user     = blend
password = blend
dbname   = blend
; Ingest directive only (single | two_table); queries auto-detect the layout from the tables present.
layout = two_table

[Semantic]
sidecar_filename     = blend_index_basenames.parquet
faiss_quant          = flat
faiss_hnsw_M         = 64
faiss_hnsw_ef_construction = 200
; Pins: present = fixed depth for every k; absent = derived from the plan's k (src/Semantic/depths.py).
faiss_hnsw_ef_search = 500
faiss_k_coarse       = 500
; Used only when the pins are absent.
; vote_depth_factor    = 2.0
; restricted_k_coarse  = 500
; FAISS-only exact-vs-HNSW crossover in columns; calibrated at ef64/kc500, re-derive with `src.Optimizer.cli report`.
exact_threshold      = 1035
device               = cpu
; faiss | pgvector
vector_backend = faiss
; off | strict_order | relaxed_order; `off` returns fewer rows than LIMIT when ef_search < LIMIT.
pgvector_hnsw_iterative_scan = relaxed_order
; prefilter | postfilter
; pg_pushdown_mode = prefilter

[Semantic.SU]
approach   = liftus
index_name = default

[Semantic.SJ]
approach   = snoopy
index_name = default

[Semantic.SHO]
approach   = simhash
index_name = default

[Optimizer]
; logical | measured
cost_basis = logical
pushdown_guard = none
pushdown_filter_width = 500
